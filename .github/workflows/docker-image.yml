name: Docker Image CI

on:
  push:
    branches: [ "candidate-assessment" ]
  pull_request:
    branches: [ "candidate-assessment" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build . --file .devcontainer/Dockerfile --tag my-image-name:$(date +%s)


